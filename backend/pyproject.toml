[project]
name = "backend"
version = "0.1.0"
description = "Bold template stack — backend (FastAPI + Postgres + Cloud Run)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi[standard]>=0.118.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pyjwt[crypto]>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "google-cloud-secret-manager>=2.20,<3",
    "google-cloud-tasks>=2.16,<3",
    "firebase-admin>=6.5,<7",
    "openai>=1.50,<2",
    "anthropic>=0.39,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-passlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

# firebase-admin no publica stubs ni marcador py.typed (ADR-011).
[[tool.mypy.overrides]]
module = ["firebase_admin.*"]
ignore_missing_imports = true

# openai/anthropic se importan LAZY en los adaptadores del motor (engine/providers); pueden no
# estar en el venv local (el smoke mockea el adaptador). En runtime/Docker sí están (deps).
[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*"]
ignore_missing_imports = true

# google-cloud-tasks se importa LAZY en app/core/cloud_tasks.py (solo Cloud Run lo usa; el
# boot/smoke local con ENV_NAME=dev hace NO-OP y nunca lo importa). En runtime/Docker es dep directa.
[[tool.mypy.overrides]]
module = ["google.cloud", "google.cloud.tasks_v2", "google.cloud.tasks_v2.*"]
ignore_missing_imports = true
