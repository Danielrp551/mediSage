# Deploy del backend a Cloud Run QA.
# Dispara en push a la rama `qa`. Los secrets viven en el GitHub Environment
# `qa` (Settings → Environments → qa) — no a nivel repo — así prod no puede
# leerlos por accidente.
#
# Acciones de terceros pinneadas a SHAs — ver comentario en backend-ci.yml.

name: deploy-backend-qa

on:
  push:
    branches: [qa]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-qa.yml"
  workflow_dispatch: # permite re-deploy manual desde la UI

concurrency:
  # Cancela deploys anteriores de QA si llega uno nuevo (evita pisarse).
  group: deploy-backend-qa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa # ← GitHub Environment; gates secrets + deployment history
    permissions:
      id-token: write
      contents: read
    env:
      ENV_NAME: qa
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: auth
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.5
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build & push image
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/medisage/${{ secrets.CLOUD_RUN_SERVICE }}:${GITHUB_SHA}"
          docker build --platform linux/amd64 -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ secrets.CLOUD_RUN_SERVICE }}" \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --service-account "${{ secrets.DEPLOY_SA }}" \
            --execution-environment gen2 \
            --no-cpu-throttling \
            --ingress all \
            --add-cloudsql-instances "${{ secrets.CLOUD_SQL_INSTANCE }}" \
            --set-env-vars "^@@^USE_UNIX_SOCKET=True@@CLOUD_SQL_INSTANCE=${{ secrets.CLOUD_SQL_INSTANCE }}@@ENV_NAME=${ENV_NAME}@@DEBUG=False@@LOG_LEVEL=INFO@@JWT_ISSUER=medisage-${ENV_NAME}@@JWT_AUDIENCE=medisage-${ENV_NAME}@@RATE_LIMIT_TRUST_FORWARDED=True@@CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}@@GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}@@CLOUD_TASKS_QUEUE=medisage-bot-turns-${ENV_NAME}@@CLOUD_TASKS_LOCATION=${{ secrets.GCP_REGION }}@@SERVICE_BASE_URL=${{ secrets.SERVICE_BASE_URL }}@@GOOGLE_OAUTH_CLIENT_ID=87449178744-2tggqahc1252v8i4anvu1f1e6fvfie03.apps.googleusercontent.com@@CALENDAR_OAUTH_REDIRECT_BASE=https://medisage-api-qa-tztfokz3eq-uc.a.run.app" \
            --set-secrets "SECRET_KEY=medisage-secret-key-${ENV_NAME}:latest,DB_USER=medisage-db-user-${ENV_NAME}:latest,DB_PASSWORD=medisage-db-password-${ENV_NAME}:latest,DB_NAME=medisage-db-name-${ENV_NAME}:latest,OPENAI_API_KEY=medisage-openai-api-key-${ENV_NAME}:latest,ANTHROPIC_API_KEY=medisage-anthropic-api-key-${ENV_NAME}:latest,BOT_DISPATCH_SECRET=medisage-bot-dispatch-secret-${ENV_NAME}:latest,GOOGLE_OAUTH_CLIENT_SECRET=medisage-google-oauth-client-secret-${ENV_NAME}:latest" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 80 \
            --cpu-boost \
            --timeout 60s
