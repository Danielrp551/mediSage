# Third-party actions are pinned to full-length SHAs (with a version comment)
# as supply-chain defense — a compromised tag can't silently change the code
# the workflow runs. Dependabot (`.github/dependabot.yml`) keeps the SHAs
# current. If a pin below 404s on first clone, copy the SHA from the latest
# release of the action and update the file.

name: backend-ci

on:
  push:
    branches: [develop, qa, prod]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [develop, qa, prod]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        env:
          SECRET_KEY: test-secret-key-with-enough-entropy
        run: pytest -q
