# Third-party actions pinned to full SHAs — see comment in backend-ci.yml.

name: frontend-ci

on:
  push:
    branches: [develop, qa, prod]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [develop, qa, prod]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # vitest run --coverage: ejecuta la suite y aplica el gate de cobertura del
        # modulo de Dashboards (RNF-04, equivalente al --cov-fail-under del backend).
        run: npm run test:cov

      - name: Build
        env:
          BACKEND_URL: http://localhost:8080
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build
